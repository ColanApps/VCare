# Render Blueprint — Docker web service + external MySQL DATABASE_URL
#
# 1. Create/link a MySQL database and set DATABASE_URL on this service.
# 2. First deploy: pre-deploy runs db:push + seed + sync-permissions.

services:
  - type: web
    name: vcare-erp
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /auth/login
    preDeployCommand: npx prisma db push && node prisma/seed.js && node prisma/sync-permissions.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_STORE
        value: mysql
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: vcare-uploads
      mountPath: /var/data/uploads
      sizeGB: 1
