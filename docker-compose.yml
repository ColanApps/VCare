services:
  mysql:
    image: mysql:8.4
    container_name: vcare-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: vcare_erp
      MYSQL_USER: vcare
      MYSQL_PASSWORD: vcare_secret
    ports:
      - "3306:3306"
    volumes:
      - vcare_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  vcare_mysql_data:
